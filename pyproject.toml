[tool.poetry]
name = "pprl-goodall"
version = "1.0"
description = ""
authors = ["Florens Rohde <florens.rohde@uni-leipzig.de>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pandas = "^2.3.3"
numpy = "^2.4.6"
streamlit = "^1.52"
matplotlib = "^3.10.6"
plotly = "^6.5.0"
plotly-express = "^0.4.1"
kaleido = "^1.1.0"  # plotly static image export
pprl-data-owner-service-api-client = { path = "api/pprl-data-owner-service-api-client" }
pprl-linkage-unit-service-api-client = { path = "api/pprl-linkage-unit-service-api-client" }
pprl-data-generator-service-api-client = { path = "api/pprl-data-generator-service-api-client" }
pprl-protocol-manager-service-api-client = { path = "api/pprl-protocol-manager-service-api-client" }
scipy = "^1.14.1"
jsonpath-ng = "^1.7.0"
st-link-analysis = "^0.4.0"
jellyfish = "^1.1.2"
tqdm = "^4.67.1"
loguru = "^0.7.3"
mlflow = {version = "3.12.0", extras = ["auth"]}
click = "^8.3.0"
scikit-learn = "^1.7.2"
pydantic = "^2.13.4"
boto3 = "^1.43.16"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.14"
deptry = "^0.25.1"
pandas-stubs = "~=2.3.3"
pip-licenses = "^5.5.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4
exclude = ["api/*", "**/diff_match_patch"]

target-version = "py312"

[tool.ruff.lint]
ignore = ["W191", "E111", "E114", "E117", "D206", "D300", "Q000", "Q001", "Q002", "Q003", "COM812", "COM819", "ISC001", "ISC002", "RET504"]
select = ["E", "F"]
#select = ["B", "C", "E", "F", "W", "B", "I", "D", "UP", "A", "C4", "T10", "ICN", "PIE", "PYI", "PT", "RET", "SIM", "ERA", "PD", "PGH", "PL", "NPY", "PERF", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
